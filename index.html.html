<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ponte English</title>
  <meta name="description" content="Curso de inglês do básico ao avançado, com imagens, áudio e exercícios dinâmicos.">
  <meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0C10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230E1116'/%3E%3Cpath d='M4 17h16M6 17v-3a6 6 0 0 1 12 0v3' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@600;700;800&display=swap">
  <style>
/* Ponte English — estilos
   Layout: app shell com barra lateral (desktop) ou barra inferior (celular); painel em blocos (bento);
   cada nível CEFR tem sua cor, usada em trilha, unidade e exercícios. */
:root{
  --bg:#ECEEF2; --card:#FFFFFF; --card-2:#F4F5F8; --ink:#0E1116; --ink-2:#5B6271; --line:#DCE0E7;
  --btn:#0E1116; --on-btn:#FFFFFF; --glass:rgba(236,238,242,.82);
  --on-lv:#0E1116;
  --a1:#FF7A59; --a1-soft:#FFE4DB; --a2:#FFC53D; --a2-soft:#FFF1CC; --b1:#34D399; --b1-soft:#D5F7E9;
  --b2:#5B9DFF; --b2-soft:#DDE9FF; --c1:#A78BFA; --c1-soft:#ECE6FF;
  --good:#138A4A; --good-soft:#D8F5E4; --bad:#C9344A; --bad-soft:#FCE1E5;
  --display:"Unbounded", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:26px; --r-sm:16px;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0C10; --card:#14171E; --card-2:#1C2029; --ink:#F1F3F7; --ink-2:#9AA1B1; --line:#272C37;
  --btn:#F1F3F7; --on-btn:#0A0C10; --glass:rgba(10,12,16,.82);
  --a1-soft:#3B211A; --a2-soft:#3A3015; --b1-soft:#11342A; --b2-soft:#182844; --c1-soft:#2B2248;
  --good:#45D88A; --good-soft:#12321F; --bad:#FF7D8E; --bad-soft:#3D1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0C10; --card:#14171E; --card-2:#1C2029; --ink:#F1F3F7; --ink-2:#9AA1B1; --line:#272C37;
  --btn:#F1F3F7; --on-btn:#0A0C10; --glass:rgba(10,12,16,.82);
  --a1-soft:#3B211A; --a2-soft:#3A3015; --b1-soft:#11342A; --b2-soft:#182844; --c1-soft:#2B2248;
  --good:#45D88A; --good-soft:#12321F; --bad:#FF7D8E; --bad-soft:#3D1820; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.side{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;padding:6px 10px 22px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--btn);display:grid;place-items:center}
.logo-mark svg{width:20px;height:20px;stroke:var(--on-btn)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.nav-btn:hover{background:var(--card);color:var(--ink)}
.nav-btn.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--a1);color:var(--on-lv);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:24px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.side-foot b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
.tabbar .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;align-items:center;position:relative}
.tabbar .nav-btn.on{background:none;box-shadow:none}
.tabbar .nav-badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
  .side{display:none} .tabbar{display:flex}
}
body.in-session .side, body.in-session .tabbar{display:none}
body.in-session .shell{grid-template-columns:minmax(0,1fr);max-width:720px;padding-block:16px 160px}

/* headers */
.page-h{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.page-h h1{font-size:clamp(28px,5vw,44px)}
.page-h h1 span{color:var(--ink-2)}
.page-h .sub{color:var(--ink-2);max-width:60ch}

/* bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0;border:1px solid var(--line)}
button.tile{transition:transform .18s ease}
button.tile:hover{transform:translateY(-3px)}
.t-continue{grid-column:span 2;grid-row:span 2;background:var(--lv);border:0;color:var(--on-lv);justify-content:space-between;position:relative;overflow:hidden;min-height:300px}
.t-continue .mono{color:var(--on-lv);opacity:.7}
.t-continue h2{font-size:clamp(26px,4vw,38px);max-width:12ch}
.t-continue .big-emoji{position:absolute;right:-10px;bottom:-24px;font-size:clamp(130px,18vw,190px);line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.t-continue .lv-code{font-family:var(--display);font-weight:800;font-size:15px;background:var(--on-lv);color:var(--lv);border-radius:10px;padding:4px 9px;align-self:flex-start}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--on-btn);font-weight:700;border-radius:999px;padding:12px 20px;align-self:flex-start;position:relative;z-index:1}
.t-continue .pill{background:var(--on-lv);color:#FFFFFF}
.t-levels,.t-wod{grid-column:span 2}
.tile-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile h3{font-size:16px}
.stat{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat small{font-family:var(--body);font-size:14px;color:var(--ink-2);font-weight:500}
.ring{width:84px;height:84px;align-self:center}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:var(--card-2)} .ring .val{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.week{display:flex;justify-content:space-between;gap:4px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.week i{width:24px;height:24px;border-radius:8px;background:var(--card-2);display:block}
.week i.on{background:var(--a1)}
.week i.today{box-shadow:0 0 0 2px var(--ink)}
.lv-row{display:grid;grid-template-columns:40px minmax(0,1fr) 44px;gap:12px;align-items:center}
.lv-chip{font-family:var(--display);font-weight:800;font-size:13px;background:var(--lv);color:var(--on-lv);border-radius:9px;text-align:center;padding:5px 0}
.lv-row .bar{height:8px}
.lv-row span{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--card-2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lv,var(--ink));border-radius:999px;transition:width .6s ease}
.t-action{justify-content:space-between;min-height:142px}
.t-action .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card-2)}
.t-action .ico svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2}
.wod{display:flex;gap:16px;align-items:center}
.wod .blob{flex:none}
.wod-word{font-family:var(--display);font-size:24px;font-weight:700}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.t-continue{min-height:250px}.tile{padding:16px}}

/* emoji blob */
.blob{width:var(--s,72px);height:var(--s,72px);border-radius:calc(var(--s,72px) * .3);background:var(--lv-soft,var(--card-2));display:grid;place-items:center;font-size:calc(var(--s,72px) * .55);line-height:1;position:relative}
.blob::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--lv,var(--line));opacity:.55}

/* path */
.level{display:flex;flex-direction:column;gap:14px;scroll-margin-top:24px}
.level-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--lv);color:var(--on-lv);border-radius:var(--r);padding:18px 22px}
.level-h .code{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,60px);line-height:.9;letter-spacing:-.04em}
.level-h h2{font-size:clamp(18px,3vw,24px)}
.level-h p{opacity:.75;font-size:14px}
.level-h .prog{font-family:var(--mono);font-size:13px;background:var(--on-lv);color:var(--lv);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.unit-tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,border-color .18s;min-width:0}
.unit-tile:hover{transform:translateY(-3px);border-color:var(--lv)}
.unit-tile h3{font-size:16px}
.unit-tile .g{font-size:13px;color:var(--ink-2)}
.unit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border-radius:999px;padding:3px 9px;background:var(--card-2);color:var(--ink-2);text-transform:uppercase}
.status.done{background:var(--good-soft);color:var(--good)}
.status.going{background:var(--lv-soft);color:var(--ink)}
.stars{color:var(--lv);font-size:15px;letter-spacing:2px}
@media (max-width:1100px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.level-h{grid-template-columns:auto minmax(0,1fr);padding:16px}.level-h .prog{grid-column:1 / -1;justify-self:start}}

/* unit page */
.unit-hero{background:var(--lv);color:var(--on-lv);border-radius:var(--r);padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.unit-hero .mono{color:var(--on-lv);opacity:.7}
.unit-hero h1{font-size:clamp(28px,5vw,42px);max-width:14ch}
.unit-hero .deco{position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(8deg);font-size:clamp(80px,14vw,130px);line-height:1}
.unit-hero .chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1;max-width:70%}
.unit-hero .chips span{background:rgba(255,255,255,.4);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.unit-hero .icon-btn{background:rgba(255,255,255,.45);border:0;color:var(--on-lv)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px;gap:4px}
.seg button{border-radius:13px;padding:10px 6px;font-weight:700;text-align:center;color:var(--ink-2);font-size:15px}
.seg button.on{background:var(--btn);color:var(--on-btn)}

/* flashcard */
.study{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.study{grid-template-columns:minmax(0,1fr)}}
.flip-zone{perspective:1400px;display:flex;flex-direction:column;gap:12px}
.flip{position:relative;width:100%;height:400px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.25,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--lv-soft)}
.face .word{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,42px);line-height:1.05;overflow-wrap:anywhere}
.face .ph{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.face .pt{font-family:var(--display);font-size:26px;font-weight:700}
.face .tap{font-size:13px;color:var(--ink-2);position:absolute;bottom:16px}
.ex{background:var(--card);border-radius:16px;padding:12px 14px;text-align:left;width:100%;font-size:15px}
.ex b{color:var(--ink)}
.ex em{display:block;font-style:normal;color:var(--ink-2);font-size:13px;margin-top:4px}
.say{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--on-btn);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.say svg{width:16px;height:16px;fill:currentColor}
.card-nav{display:flex;gap:10px;align-items:center}
.card-nav .count{flex:1;text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btn{border-radius:16px;padding:14px 18px;font-weight:700;background:var(--card);border:1px solid var(--line);text-align:center}
.btn.dark{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.word-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wchip{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;min-width:0;transition:border-color .15s}
.wchip:hover,.wchip.on{border-color:var(--lv)}
.wchip .blob{--s:46px}
.wchip div{min-width:0}
.wchip b{display:block;font-size:15px;overflow-wrap:anywhere}
.wchip span{font-size:13px;color:var(--ink-2)}

/* grammar */
.gram{display:flex;flex-direction:column;gap:14px}
.gram .rule{font-size:17px;max-width:62ch}
.gtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;font-size:15px}
.gtable td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable tr:last-child td{border-bottom:0}
.gtable td:first-child{font-weight:700;background:var(--lv-soft);white-space:nowrap}
.gtable-wrap{overflow-x:auto;border-radius:20px}
.tipbox{display:flex;gap:14px;background:var(--card);border:1px dashed var(--lv);border-radius:20px;padding:16px;font-size:15px}
.tipbox .t{font-family:var(--display);font-weight:800;color:var(--lv);font-size:13px;flex:none;padding-top:2px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ex-row div{flex:1;min-width:0}
.ex-row span{display:block;color:var(--ink-2);font-size:14px}
.round{width:38px;height:38px;border-radius:50%;background:var(--lv-soft);display:grid;place-items:center;flex:none}
.round svg{width:16px;height:16px;fill:var(--ink)}

/* practice intro */
.prac{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.prac div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.prac b{font-size:15px}
.prac .e{font-size:26px}

/* session */
.sess{display:flex;flex-direction:column;gap:22px}
.sess-top{display:flex;align-items:center;gap:14px}
.sess-top .bar{flex:1;height:12px}
.sess-top .bar>i{background:var(--lv)}
.q{display:flex;flex-direction:column;gap:20px;animation:qIn .35s ease}
@keyframes qIn{from{transform:translateY(10px)}to{transform:none}}
.q-kind{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.q-kind i{width:8px;height:8px;border-radius:50%;background:var(--lv)}
.q h2{font-size:clamp(22px,4vw,30px)}
.q h2 em{font-style:normal;background:var(--lv-soft);border-radius:10px;padding:0 8px}
.q-center{display:flex;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 12px;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:64px;transition:border-color .15s,transform .1s;overflow-wrap:anywhere}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:active{transform:scale(.98)}
.opt .e{font-size:40px;line-height:1}
.opt.pic .e{font-size:56px}
.opt kbd{font-family:var(--mono);font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sentence{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;font-size:20px;line-height:1.6}
.sentence .gap{display:inline-block;min-width:96px;border-bottom:3px solid var(--lv);text-align:center;font-weight:700;padding:0 6px}
.sentence .tr{display:block;font-size:14px;color:var(--ink-2);margin-top:6px}
.play{width:120px;height:120px;border-radius:40px;background:var(--lv);display:grid;place-items:center;transition:transform .15s}
.play:active{transform:scale(.95)}
.play svg{width:46px;height:46px;fill:var(--on-lv)}
.slow{font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.type-in{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;font-size:20px;font-family:var(--display);outline:none}
.type-in:focus{border-color:var(--lv)}
.type-in.ok{border-color:var(--good);background:var(--good-soft)}
.type-in.no{border-color:var(--bad);background:var(--bad-soft)}
.hint-line{font-family:var(--mono);font-size:15px;letter-spacing:.2em;color:var(--ink-2)}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:600;min-height:58px;text-align:center;overflow-wrap:anywhere}
.pair.sel{border-color:var(--lv);background:var(--lv-soft)}
.pair.done{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.55}
.pair.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.build-line{min-height:70px;background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.build-line.ok{border-color:var(--good);border-style:solid}
.build-line.no{border-color:var(--bad);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:600;font-size:16px}
.tok.used{visibility:hidden}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid currentColor;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.good{background:var(--good-soft);color:var(--good)}
.sheet.bad{background:var(--bad-soft);color:var(--bad)}
.sheet-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sheet-in div{flex:1;min-width:200px}
.sheet-in b{display:block;font-family:var(--display);font-size:20px}
.sheet-in span{color:var(--ink)}
.sheet .btn{background:currentColor;border:0;min-width:160px}
.sheet .btn span{color:var(--card)}

/* results */
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.result .medal{width:140px;height:140px;border-radius:44px;background:var(--lv);display:grid;place-items:center;font-size:72px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.08)}100%{transform:none}}
.result h1{font-size:clamp(28px,5vw,38px)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.score div{background:var(--card-2);border-radius:18px;padding:14px 8px}
.score b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.miss{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.miss .ex-row{background:var(--bad-soft);border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

/* settings & empty */
.set-list{display:flex;flex-direction:column;gap:12px}
.set{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.set .seg{background:var(--card-2);border:0}
.set input[type=range]{width:100%;accent-color:var(--ink)}
.danger{color:var(--bad);border-color:var(--bad)}
.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .blob{--s:96px}
.place-res{display:flex;flex-direction:column;gap:8px;width:100%}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>

  <script>
/* Ponte English — lógica do app (sem dependências) */
(function () {
  'use strict';

  /* ---------- dados ---------- */
  const LV = window.COURSE.levels;
  LV.forEach(function (l) {
    l.units.forEach(function (u, i) {
      u.id = l.id + '-' + (i + 1); u.n = i + 1; u.level = l;
      u.words = u.words.map(function (a, k) {
        return { id: u.id + ':' + k, en: a[0], pt: a[1], e: a[2], ex: a[3], exPt: a[4], ph: a[5] || '', unit: u };
      });
    });
  });
  const UNITS = LV.flatMap(function (l) { return l.units; });
  const WORDS = UNITS.flatMap(function (u) { return u.words; });
  const WORD_BY_ID = {}; WORDS.forEach(function (w) { WORD_BY_ID[w.id] = w; });
  const GOAL = 50;

  /* ---------- progresso salvo no navegador ---------- */
  const KEY = 'ponte-english-v1';
  const DEF = { xp: 0, days: {}, units: {}, review: {}, last: null, rate: 0.9, theme: 'auto', level: null };
  let S = load();
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return Object.assign({}, DEF, s || {}); }
    catch (e) { return Object.assign({}, DEF); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
  function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function today() { return dayKey(new Date()); }
  function addXP(n) { S.xp += n; S.days[today()] = (S.days[today()] || 0) + n; save(); }
  function streak() {
    let n = 0; const d = new Date();
    if (!S.days[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (S.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function unitState(u) { return S.units[u.id] || {}; }

  /* ---------- montagem das rodadas ---------- */
  function unitQuestions(u) {

      view.innerHTML =
        '<div class="sess" style="' + lvStyle(cfg.lv) + '"><div class="sess-top"><button class="icon-btn" id="quit" aria-label="Sair da prática">' + I.x + '</button>' +
        '<div class="bar"><i style="width:' + (i / total * 100) + '%"></i></div><span class="mono">' + (i + 1) + '/' + total + '</span></div>' +
        '<div class="q"><span class="q-kind"><i></i>' + kind + '</span>' + inner + '</div></div>';
      $('#quit').onclick = function () { keyHandler = null; hideSheet(); cfg.onQuit(); };
    }
    function answer(ok, word, title, msg) {
      const q = cfg.qs[i]; q.ok = ok;
      if (ok) right++;
      if (word) {
        if (ok) { if (cfg.review) delete S.review[word.id]; }
        else { S.review[word.id] = 1; if (missed.indexOf(word) < 0) missed.push(word); }
        save(); say(word.en);
      }
      showSheet(ok, title || (ok ? pick(['Mandou bem!', 'Perfeito!', 'Isso aí!', 'Boa!']) : 'Não foi dessa vez'), msg, function () { i++; next(); });
    }
    function next() {
      hideSheet(); keyHandler = null;
      if (i >= total) { setSession(false); return cfg.onEnd({ right: right, total: total, missed: missed, qs: cfg.qs }); }
      const q = cfg.qs[i];
      ({ pic: qPic, meaning: qMeaning, reverse: qReverse, listen: qListen, fill: qFill, type: qType, match: qMatch, build: qBuild, drill: qDrill })[q.t](q);
      window.scrollTo(0, 0);
    }
    function wireOpts(correct, onPick) {
      const opts = $$('.opt');
      opts.forEach(function (b) {
        b.onclick = function () {
          if (b.disabled) return;
          opts.forEach(function (x) { x.disabled = true; if (x.dataset.v === correct) x.classList.add('ok'); });
          const ok = b.dataset.v === correct; if (!ok) b.classList.add('no');
          onPick(ok);
        };
      });
      keyHandler = function (e) { const n = parseInt(e.key, 10); if (n >= 1 && n <= opts.length && !opts[0].disabled) opts[n - 1].click(); };
    }
    function optHTML(list, render) {
      return list.map(function (o, k) { return '<button class="opt' + (render.cls || '') + '" data-v="' + esc(o.en) + '"' + (render.aria ? ' aria-label="' + esc(o.pt) + '"' : '') + '>' + render.fn(o) + '<kbd>' + (k + 1) + '</kbd></button>'; }).join('');
    }

    function qPic(q) {
      const w = q.w, opts = shuffle([w].concat(others(w, q.pool, 3)));
      frame('<h2>Que palavra é essa?</h2><div class="q-center"><div class="blob" style="--s:160px">' + w.e + '</div></div>' +
        '<div class="opts">' + optHTML(opts, { fn: function (o) { return esc(o.en); } }) + '</div>', 'Imagem');
      wireOpts(w.en, function (ok) { answer(ok, w, null, ok ? w.e + ' ' + esc(w.en) + ' = ' + esc(w.pt) : 'Era <b>' + esc(w.en) + '</b> (' + esc(w.pt) + ').'); });
    }
    function qMeaning(q) {
      const w = q.w, opts = shuffle([w].concat(others(w, q.pool, 3)));
      frame('<h2>O que significa <em>' + esc(w.en) + '</em>?</h2>' + (canSpeak ? '<button class="say" id="hear" style="align-self:flex-start">' + I.sound + 'Ouvir</button>' : '') +
        '<div class="opts">' + optHTML(opts, { fn: function (o) { return '<span class="e">' + o.e + '</span>' + esc(o.pt); } }) + '</div>', 'Significado');
      const h = $('#hear'); if (h) h.onclick = function () { say(w.en); };
      say(w.en);
      wireOpts(w.en, function (ok) { answer(ok, w, null, ok ? esc(w.en) + ' = ' + esc(w.pt) : '<b>' + esc(w.en) + '</b> significa ' + esc(w.pt) + '.'); });
    }
    function qReverse(q) {
      const w = q.w, opts = shuffle([w].concat(others(w, q.pool, 3)));
      frame('<h2>Como se diz <em>' + esc(w.pt) + '</em> em inglês?</h2>' +
        '<div class="opts">' + optHTML(opts, { fn: function (o) { return '<span class="e">' + o.e + '</span>' + esc(o.en); } }) + '</div>', 'Tradução');
      wireOpts(w.en, function (ok) { answer(ok, w, null, ok ? esc(w.pt) + ' = ' + esc(w.en) : 'O certo é <b>' + esc(w.en) + '</b>.'); });
    }
    function qListen(q) {
      const w = q.w, opts = shuffle([w].concat(others(w, q.pool, 3)));
      frame('<h2>Ouça e toque na imagem certa</h2><div class="q-center" style="flex-direction:column;align-items:center;gap:10px"><button class="play" id="play" aria-label="Ouvir de novo">' + I.sound + '</button>' +
        '<button class="slow" id="slow">Ouvir devagar</button></div>' +
        '<div class="opts">' + optHTML(opts, { cls: ' pic', aria: true, fn: function (o) { return '<span class="e">' + o.e + '</span>'; } }) + '</div>', 'Escuta');
      $('#play').onclick = function () { say(w.en); };
      $('#slow').onclick = function () { say(w.en, 0.55); };
      setTimeout(function () { say(w.en); }, 250);
      wireOpts(w.en, function (ok) { answer(ok, w, null, w.e + ' <b>' + esc(w.en) + '</b> = ' + esc(w.pt)); });
    }
    function qFill(q) {
      const w = q.w, opts = shuffle([w].concat(others(w, q.pool, 3)));
      const sent = esc(w.ex).replace(/\{.+?\}/, '<span class="gap" id="gap">?</span>');
      frame('<h2>Complete a frase</h2><div class="sentence">' + sent + '<span class="tr">' + esc(w.exPt) + '</span></div>' +
        '<div class="opts">' + optHTML(opts, { fn: function (o) { return esc(o.en); } }) + '</div>', 'Contexto');
      wireOpts(w.en, function (ok) {
        $('#gap').textContent = w.ex.match(/\{(.+?)\}/)[1];
        answer(ok, w, null, ok ? 'Frase completa: ' + esc(plain(w.ex)) : 'A palavra certa era <b>' + esc(w.en) + '</b>.');
        setTimeout(function () { say(plain(w.ex)); }, 700);
      });
    }
    function qType(q) {
      const w = q.w;
      const hint = w.en.split('').map(function (c, k) { return c === ' ' ? '  ' : k === 0 ? c : '_'; }).join(' ');
      frame('<h2>Escreva em inglês: <em>' + esc(w.pt) + '</em></h2><div class="q-center"><div class="blob" style="--s:120px">' + w.e + '</div></div>' +
        '<p class="hint-line" aria-hidden="true">' + esc(hint) + '</p>' +
        '<form id="tf" autocomplete="off"><input class="type-in" id="typein" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Digite aqui" aria-label="Sua resposta"></form>' +
        '<button class="btn dark wide" id="check">Verificar</button>', 'Escrita');
      const inp = $('#typein'); setTimeout(function () { try { inp.focus(); } catch (e) { } }, 50);
      function check() {
        if (inp.disabled) return;
        if (!inp.value.trim()) { inp.focus(); return; }
        inp.disabled = true; $('#check').disabled = true;
        const ok = norm(inp.value) === norm(w.en);
        inp.classList.add(ok ? 'ok' : 'no');
        answer(ok, w, null, ok ? w.e + ' ' + esc(w.en) + ' = ' + esc(w.pt) : 'Escreve-se <b>' + esc(w.en) + '</b>.');
      }
      $('#tf').onsubmit = function (e) { e.preventDefault(); check(); };
      $('#check').onclick = check;
    }
    function qMatch(q) {
      const L = shuffle(q.words), R = shuffle(q.words);
      frame('<h2>Ligue os pares</h2><div class="pairs">' + L.map(function (w, k) {
        return '<button class="pair" data-s="en" data-w="' + esc(w.id) + '">' + esc(w.en) + '</button><button class="pair" data-s="pt" data-w="' + esc(R[k].id) + '">' + R[k].e + ' ' + esc(R[k].pt) + '</button>';
      }).join('') + '</div>', 'Pares');
      let sel = null, done = 0, errs = 0;
      $$('.pair').forEach(function (b) {
        b.onclick = function () {
          if (b.classList.contains('done')) return;
          if (!sel || sel.dataset.s === b.dataset.s) {
            if (sel) sel.classList.remove('sel');
            sel = b; b.classList.add('sel');
            if (b.dataset.s === 'en') say(WORD_BY_ID[b.dataset.w].en);
            return;
          }
          if (sel.dataset.w === b.dataset.w) {
            [sel, b].forEach(function (x) { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
            done++;
            if (done === q.words.length) answer(errs === 0, null, errs === 0 ? 'Todos de primeira!' : 'Pares completos', errs === 0 ? 'Nenhum erro.' : errs + ' erro' + (errs > 1 ? 's' : '') + ' no caminho. Na próxima, tente sem errar.');
          } else {
            errs++; const a = sel;
            [a, b].forEach(function (x) { x.classList.add('no'); });
            setTimeout(function () { [a, b].forEach(function (x) { x.classList.remove('no', 'sel'); }); }, 420);
          }
          sel = null;
        };
      });
    }
    function qBuild(q) {
      const target = q.s[0].split(' ');
      const bank = shuffle(target.map(function (t, k) { return { t: t, k: k }; }));
      frame('<h2>Monte a frase em inglês</h2><div class="sentence" style="font-size:17px">' + esc(q.s[1]) + '</div>' +
        '<div class="build-line" id="line" aria-label="Sua frase"></div><div class="bank" id="bank">' +
        bank.map(function (b, k) { return '<button class="tok" data-k="' + k + '">' + esc(b.t) + '</button>'; }).join('') + '</div>' +
        '<button class="btn dark wide" id="check" disabled>Verificar</button>', 'Montar frase');
      const chosen = [];
      function draw() {
        $('#line').innerHTML = chosen.map(function (k, pos) { return '<button class="tok" data-pos="' + pos + '">' + esc(bank[k].t) + '</button>'; }).join('');
        $$('#bank .tok').forEach(function (b) { b.classList.toggle('used', chosen.indexOf(+b.dataset.k) >= 0); });
        $$('#line .tok').forEach(function (b) { b.onclick = function () { if ($('#check').dataset.done) return; chosen.splice(+b.dataset.pos, 1); draw(); }; });
        $('#check').disabled = chosen.length !== bank.length;
      }
      $$('#bank .tok').forEach(function (b) { b.onclick = function () { if ($('#check').dataset.done) return; const k = +b.dataset.k; if (chosen.indexOf(k) < 0) { chosen.push(k); say(bank[k].t); draw(); } }; });
      $('#check').onclick = function () {
        $('#check').dataset.done = '1'; $('#check').disabled = true;
        const built = chosen.map(function (k) { return bank[k].t; }).join(' ');
        const ok = norm(built) === norm(q.s[0]);
        $('#line').classList.add(ok ? 'ok' : 'no');
        answer(ok, null, null, ok ? esc(q.s[0]) : 'O certo é: <b>' + esc(q.s[0]) + '</b>');
        say(q.s[0]);
      };
    }
    function qDrill(q) {
      const d = q.d, correct = d[1][0], opts = shuffle(d[1]);
      frame('<h2>Escolha a opção correta</h2><div class="sentence">' + esc(d[0]).replace('___', '<span class="gap" id="gap">?</span>') + '<span class="tr" id="tr" hidden>' + esc(d[2]) + '</span></div>' +
        '<div class="opts">' + opts.map(function (o, k) { return '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '<kbd>' + (k + 1) + '</kbd></button>'; }).join('') + '</div>', 'Gramática');
      wireOpts(correct, function (ok) {
        $('#gap').textContent = correct; $('#tr').hidden = false;
        answer(ok, null, null, ok ? esc(d[2]) : 'O certo é <b>' + esc(correct) + '</b>. ' + esc(d[2]));
        say(d[0].replace('___', correct).replace(/"/g, ''));
      });
    }
    next();
  }

  /* ---------- barra de resposta ---------- */
  function showSheet(ok, title, msg, onNext) {
    const sh = $('#sheet');
    sh.className = 'sheet ' + (ok ? 'good' : 'bad');
    sh.innerHTML = '<div class="sheet-in"><div><b>' + esc(title) + '</b>' + (msg ? '<span>' + msg + '</span>' : '') + '</div><button class="btn" id="cont"><span>Continuar</span></button></div>';
    sh.hidden = false;
    const c = $('#cont'); c.onclick = onNext;
    setTimeout(function () { try { c.focus({ preventScroll: true }); } catch (e) { } }, 30);
    keyHandler = function (e) { if (e.key === 'Enter') { e.preventDefault(); onNext(); } };
  }
  function hideSheet() { const sh = $('#sheet'); if (sh) { sh.hidden = true; sh.innerHTML = ''; } }

  /* ---------- resultado ---------- */
  function showResult(r) {
    const p = r.right / r.total;
    view.innerHTML =
      '<div class="result" style="' + lvStyle(r.lv) + '"><div class="medal">' + r.medal + '</div><h1>' + esc(r.title) + '</h1><p class="muted">' + esc(r.sub) + '</p>' +
      '<div class="score"><div><b>' + Math.round(p * 100) + '%</b><span class="mono">acertos</span></div><div><b>+' + r.gain + '</b><span class="mono">pontos</span></div><div><b>' + streak() + '</b><span class="mono">sequência</span></div></div>' +
      (r.missed.length ? '<div class="miss"><p class="mono">Foram para a revisão</p>' + r.missed.map(function (w) { return '<div class="ex-row"><span class="blob" style="--s:40px">' + w.e + '</span><div><b>' + esc(w.en) + '</b><span>' + esc(w.pt) + '</span></div></div>'; }).join('') + '</div>' : '') +
      '<div class="row2"><button class="btn" id="again">Refazer</button><button class="btn dark" id="nxt">' + esc(r.nextLabel) + '</button></div></div>';
    $('#again').onclick = r.again; $('#nxt').onclick = r.next;
    $('#side-xp').textContent = S.xp;
    window.scrollTo(0, 0);
  }

  /* ---------- revisão ---------- */
  function review() {
    const ids = Object.keys(S.review).filter(function (id) { return WORD_BY_ID[id]; });
    if (!ids.length) {
      view.innerHTML = '<header class="page-h"><p class="mono">Revisão</p><h1>Tudo em dia</h1></header>' +
        '<div class="empty"><div class="blob">✅</div><h2 style="font-size:22px">Nenhuma palavra pendente</h2><p class="muted" style="max-width:44ch">Quando você errar uma palavra numa prática, ela aparece aqui para reforçar. Acerte na revisão e ela sai da lista.</p><button class="btn dark" id="tp">Ir para a trilha</button></div>';
      $('#tp').onclick = function () { go('path'); };
      return;
    }
    const words = ids.map(function (id) { return WORD_BY_ID[id]; });
    view.innerHTML = '<header class="page-h"><p class="mono">Revisão</p><h1>' + words.length + ' palavra' + (words.length > 1 ? 's' : '') + ' para reforçar</h1><p class="sub">Palavras que você errou nas práticas. Acerte para tirá-las da lista.</p></header>' +
      '<div class="word-grid">' + words.slice(0, 12).map(function (w) { return '<div class="wchip" style="' + lvStyle(w.unit.level) + '"><div class="blob">' + w.e + '</div><div><b>' + esc(w.en) + '</b><span>' + esc(w.pt) + ' · ' + w.unit.level.id + '</span></div></div>'; }).join('') + '</div>' +
      '<button class="btn dark wide" id="startrev">Começar revisão</button>';
    $('#startrev').onclick = function () {
      const sel = shuffle(words).slice(0, 10);
      const types = ['pic', 'type', 'meaning', 'reverse'];
      runSession({
        lv: sel[0].unit.level, review: true,
        qs: sel.map(function (w, k) { return { t: types[k % types.length], w: w, pool: w.unit.level.units.flatMap(function (u) { return u.words; }) }; }),
        onQuit: function () { go('review'); },
        onEnd: function (r) {
          addXP(r.right * 10);
          showResult({ lv: sel[0].unit.level, right: r.right, total: r.total, gain: r.right * 10, missed: r.missed, title: 'Revisão feita', sub: r.missed.length ? 'As que você errou continuam na lista.' : 'Lista limpa nessa rodada.', medal: '🔁', again: function () { go('review'); }, next: function () { go('home'); }, nextLabel: 'Voltar ao início' });
        }
      });
    };
  }

  /* ---------- teste de nível ---------- */
  function testIntro() {
    view.innerHTML = '<header class="page-h"><p class="mono">Teste de nível</p><h1>Por onde você deve começar?</h1><p class="sub">' + (LV.length * 2) + ' perguntas de gramática, das mais fáceis às mais difíceis. Leva uns 3 minutos e não vale pontos.</p></header>' +
      (S.level ? '<div class="tile" style="' + lvStyle(LV.find(function (l) { return l.id === S.level; })) + '"><p class="mono">Último resultado</p><div class="lv-row" style="grid-template-columns:48px 1fr"><span class="lv-chip">' + S.level + '</span><b>' + esc(LV.find(function (l) { return l.id === S.level; }).name) + '</b></div></div>' : '') +
      '<div class="tile">' + LV.map(function (l) { return '<div class="lv-row" style="' + lvStyle(l) + ';grid-template-columns:48px 1fr"><span class="lv-chip">' + l.id + '</span><span style="text-align:left;font-family:var(--body);font-size:14px">' + esc(l.name) + ' · ' + esc(l.desc) + '</span></div>'; }).join('') + '</div>' +
      '<button class="btn dark wide" id="starttest">Começar o teste</button>';
    $('#starttest').onclick = function () {
      const qs = [];
      LV.forEach(function (l) { shuffle(l.units).slice(0, 2).forEach(function (u) { const q = { t: 'drill', d: pick(u.grammar.drills), lv: l.id }; qs.push(q); }); });
      runSession({
        lv: LV[0], qs: qs, onQuit: function () { go('test'); },
        onEnd: function (r) {
          let rec = LV[LV.length - 1];
          for (let k = 0; k < LV.length; k++) {
            const got = r.qs.filter(function (q) { return q.lv === LV[k].id && q.ok; }).length;
            if (got < 2) { rec = LV[k]; break; }
          }
          S.level = rec.id; save();
          view.innerHTML = '<div class="result" style="' + lvStyle(rec) + '"><div class="medal" style="font-family:var(--display);font-weight:800;font-size:56px;color:var(--on-lv)">' + rec.id + '</div>' +
            '<h1>Comece pelo ' + rec.id + '</h1><p class="muted">' + esc(rec.name) + ': ' + esc(rec.desc) + '</p>' +
            '<div class="place-res">' + LV.map(function (l) {
              const got = r.qs.filter(function (q) { return q.lv === l.id && q.ok; }).length;
              return '<div class="lv-row" style="' + lvStyle(l) + '"><span class="lv-chip">' + l.id + '</span><div class="bar"><i style="width:' + (got / 2 * 100) + '%"></i></div><span>' + got + '/2</span></div>';
            }).join('') + '</div>' +
            '<div class="row2"><button class="btn" id="again">Refazer</button><button class="btn dark" id="nxt">Ir para o ' + rec.id + ' →</button></div></div>';
          $('#again').onclick = function () { go('test'); };
          $('#nxt').onclick = function () { go('path', { level: rec.id }); };
        }
      });
    };
  }

  /* ---------- ajustes ---------- */
  function settings() {
    view.innerHTML = '<header class="page-h"><p class="mono">Ajustes</p><h1>Do seu jeito</h1></header><div class="set-list">' +
      '<div class="set"><h3>Aparência</h3><div class="seg" id="theme"><button data-th="auto">Automático</button><button data-th="light">Claro</button><button data-th="dark">Escuro</button></div></div>' +
      (canSpeak ? '<div class="set"><h3>Velocidade da voz</h3><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="' + S.rate + '" aria-label="Velocidade da voz"><div class="tile-h"><span class="muted" id="ratev">' + S.rate.toFixed(2) + 'x</span><button class="say" id="testv">' + I.sound + 'Testar</button></div></div>'
        : '<div class="set"><h3>Áudio</h3><p class="muted">Este navegador não tem voz em inglês disponível. No Chrome ou Safari do celular o áudio funciona.</p></div>') +
      '<div class="set"><h3>Progresso</h3><p class="muted">' + S.xp + ' pontos · ' + UNITS.filter(isDone).length + ' de ' + UNITS.length + ' unidades concluídas. O progresso fica salvo só neste navegador e neste aparelho.</p>' +
      '<button class="btn danger" id="reset">Apagar meu progresso</button></div></div>';
    $$('[data-th]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.th === S.theme);
      b.onclick = function () { S.theme = b.dataset.th; save(); applyTheme(); settings(); };
    });
    const r = $('#rate');
    if (r) {
      r.oninput = function () { S.rate = +r.value; $('#ratev').textContent = S.rate.toFixed(2) + 'x'; save(); };
      $('#testv').onclick = function () { say('Hello! Nice to meet you.'); };
    }
    const rs = $('#reset');
    rs.onclick = function () {
      if (!rs.dataset.armed) { rs.dataset.armed = '1'; rs.textContent = 'Toque de novo para confirmar'; return; }
      const theme = S.theme; S = Object.assign({}, DEF, { theme: theme }); save(); go('home');
    };
  }

  applyTheme();
  go('home');
})();

</script>
</body>
</html>
