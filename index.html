      $('#play').onclick = function () { say(w.en); };
      $('#slow').onclick = function () { say(w.en, 0.55); };
      setTimeout(function () { say(w.en); }, 250);
      wireOpts(w.en, function (ok) { answer(ok, w, null, w.e + ' <b>' + esc(w.en) + '</b> = ' + esc(w.pt)); });
    }
    function qFill(q) {
      const w = q.w, opts = shuffle([w].concat(others(w, q.pool, 3)));
      const sent = esc(w.ex).replace(/\{.+?\}/, '<span class="gap" id="gap">?</span>');
      frame('<h2>Complete a frase</h2><div class="sentence">' + sent + '<span class="tr">' + esc(w.exPt) + '</span></div>' +
        '<div class="opts">' + optHTML(opts, { fn: function (o) { return esc(o.en); } }) + '</div>', 'Contexto');
      wireOpts(w.en, function (ok) {
        $('#gap').textContent = w.ex.match(/\{(.+?)\}/)[1];
        answer(ok, w, null, ok ? 'Frase completa: ' + esc(plain(w.ex)) : 'A palavra certa era <b>' + esc(w.en) + '</b>.');
        setTimeout(function () { say(plain(w.ex)); }, 700);
      });
    }
    function qType(q) {
      const w = q.w;
      const hint = w.en.split('').map(function (c, k) { return c === ' ' ? '  ' : k === 0 ? c : '_'; }).join(' ');
      frame('<h2>Escreva em inglês: <em>' + esc(w.pt) + '</em></h2><div class="q-center"><div class="blob" style="--s:120px">' + w.e + '</div></div>' +
        '<p class="hint-line" aria-hidden="true">' + esc(hint) + '</p>' +
        '<form id="tf" autocomplete="off"><input class="type-in" id="typein" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Digite aqui" aria-label="Sua resposta"></form>' +
        '<button class="btn dark wide" id="check">Verificar</button>', 'Escrita');
      const inp = $('#typein'); setTimeout(function () { try { inp.focus(); } catch (e) { } }, 50);
      function check() {
        if (inp.disabled) return;
        if (!inp.value.trim()) { inp.focus(); return; }
        inp.disabled = true; $('#check').disabled = true;
        const ok = norm(inp.value) === norm(w.en);
        inp.classList.add(ok ? 'ok' : 'no');
        answer(ok, w, null, ok ? w.e + ' ' + esc(w.en) + ' = ' + esc(w.pt) : 'Escreve-se <b>' + esc(w.en) + '</b>.');
      }
      $('#tf').onsubmit = function (e) { e.preventDefault(); check(); };
      $('#check').onclick = check;
    }
    function qMatch(q) {
      const L = shuffle(q.words), R = shuffle(q.words);
      frame('<h2>Ligue os pares</h2><div class="pairs">' + L.map(function (w, k) {
        return '<button class="pair" data-s="en" data-w="' + esc(w.id) + '">' + esc(w.en) + '</button><button class="pair" data-s="pt" data-w="' + esc(R[k].id) + '">' + R[k].e + ' ' + esc(R[k].pt) + '</button>';
      }).join('') + '</div>', 'Pares');
      let sel = null, done = 0, errs = 0;
      $$('.pair').forEach(function (b) {
        b.onclick = function () {
          if (b.classList.contains('done')) return;
          if (!sel || sel.dataset.s === b.dataset.s) {
            if (sel) sel.classList.remove('sel');
            sel = b; b.classList.add('sel');
            if (b.dataset.s === 'en') say(WORD_BY_ID[b.dataset.w].en);
            return;
          }
          if (sel.dataset.w === b.dataset.w) {
            [sel, b].forEach(function (x) { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
            done++;
            if (done === q.words.length) answer(errs === 0, null, errs === 0 ? 'Todos de primeira!' : 'Pares completos', errs === 0 ? 'Nenhum erro.' : errs + ' erro' + (errs > 1 ? 's' : '') + ' no caminho. Na próxima, tente sem errar.');
          } else {
            errs++; const a = sel;
            [a, b].forEach(function (x) { x.classList.add('no'); });
            setTimeout(function () { [a, b].forEach(function (x) { x.classList.remove('no', 'sel'); }); }, 420);
          }
          sel = null;
        };
      });
    }
    function qBuild(q) {
      const target = q.s[0].split(' ');
      const bank = shuffle(target.map(function (t, k) { return { t: t, k: k }; }));
      frame('<h2>Monte a frase em inglês</h2><div class="sentence" style="font-size:17px">' + esc(q.s[1]) + '</div>' +
        '<div class="build-line" id="line" aria-label="Sua frase"></div><div class="bank" id="bank">' +
        bank.map(function (b, k) { return '<button class="tok" data-k="' + k + '">' + esc(b.t) + '</button>'; }).join('') + '</div>' +
        '<button class="btn dark wide" id="check" disabled>Verificar</button>', 'Montar frase');
      const chosen = [];
      function draw() {
        $('#line').innerHTML = chosen.map(function (k, pos) { return '<button class="tok" data-pos="' + pos + '">' + esc(bank[k].t) + '</button>'; }).join('');
        $$('#bank .tok').forEach(function (b) { b.classList.toggle('used', chosen.indexOf(+b.dataset.k) >= 0); });
        $$('#line .tok').forEach(function (b) { b.onclick = function () { if ($('#check').dataset.done) return; chosen.splice(+b.dataset.pos, 1); draw(); }; });
        $('#check').disabled = chosen.length !== bank.length;
      }
      $$('#bank .tok').forEach(function (b) { b.onclick = function () { if ($('#check').dataset.done) return; const k = +b.dataset.k; if (chosen.indexOf(k) < 0) { chosen.push(k); say(bank[k].t); draw(); } }; });
      $('#check').onclick = function () {
        $('#check').dataset.done = '1'; $('#check').disabled = true;
        const built = chosen.map(function (k) { return bank[k].t; }).join(' ');
        const ok = norm(built) === norm(q.s[0]);
        $('#line').classList.add(ok ? 'ok' : 'no');
        answer(ok, null, null, ok ? esc(q.s[0]) : 'O certo é: <b>' + esc(q.s[0]) + '</b>');
        say(q.s[0]);
      };
    }
    function qDrill(q) {
      const d = q.d, correct = d[1][0], opts = shuffle(d[1]);
      frame('<h2>Escolha a opção correta</h2><div class="sentence">' + esc(d[0]).replace('___', '<span class="gap" id="gap">?</span>') + '<span class="tr" id="tr" hidden>' + esc(d[2]) + '</span></div>' +
        '<div class="opts">' + opts.map(function (o, k) { return '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '<kbd>' + (k + 1) + '</kbd></button>'; }).join('') + '</div>', 'Gramática');
      wireOpts(correct, function (ok) {
        $('#gap').textContent = correct; $('#tr').hidden = false;

        say(d[0].replace('___', correct).replace(/"/g, ''));
      });
    }
    next();
  }

  function guideSession(c) {

      onQuit: function () { go('chapter', { id: c.id }); },

  /* ---------- conjugador ---------- */
  const TENSES = [
    ['ps', 'Presente simples', 'Present simple', 'rotinas e fatos'], ['pc', 'Presente contínuo', 'Present continuous', 'o que acontece agora'],
    ['pa', 'Passado simples', 'Past simple', 'o que aconteceu'], ['pac', 'Passado contínuo', 'Past continuous', 'estava acontecendo'],
    ['pp', 'Presente perfeito', 'Present perfect', 'liga passado e presente'], ['ppc', 'Presente perfeito contínuo', 'Present perfect continuous', 'duração até agora'],
    ['pap', 'Passado perfeito', 'Past perfect', 'antes de outro passado'], ['fut', 'Futuro com will', 'Future (will)', 'decisões e promessas'],
    ['fp', 'Futuro perfeito', 'Future perfect', 'concluído até certo momento'], ['cond', 'Condicional', 'Conditional (would)', 'hipóteses']
  ];
  const PERS = [['I', '1'], ['you', '2'], ['he / she / it', '3'], ['we', '4'], ['they', '5']];
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }
  function phrase(v, t, p, mode) {
    const b = v[0], s = v[1], ing = v[2], pa = v[3], pp = v[4], isBe = b === 'be';
    const third = p[1] === '3', first = p[1] === '1', sq = p[0].split(' / ')[0];
    const beP = first ? 'am' : third ? 'is' : 'are', beN = first ? 'am not' : third ? 'isn\'t' : 'aren\'t';
    const beA = (first || third) ? 'was' : 'were', beAN = (first || third) ? 'wasn\'t' : 'weren\'t';
    const hv = third ? 'has' : 'have', hvN = third ? 'hasn\'t' : 'haven\'t';
    function Q(aux, rest) { return cap(aux) + ' ' + sq + (rest ? ' ' + rest : '') + '?'; }
    const M = function (a, n, q) { return mode === 'aff' ? a : mode === 'neg' ? n : q; };
    switch (t) {
      case 'ps': return isBe ? M(beP, beN, Q(beP, '…')) : M(third ? s : b, (third ? 'doesn\'t ' : 'don\'t ') + b, Q(third ? 'does' : 'do', b));
      case 'pc': return M(beP + ' ' + ing, beN + ' ' + ing, Q(beP, ing));
      case 'pa': return isBe ? M(beA, beAN, Q(beA, '…')) : M(pa, 'didn\'t ' + b, Q('did', b));
      case 'pac': return M(beA + ' ' + ing, beAN + ' ' + ing, Q(beA, ing));
      case 'pp': return M(hv + ' ' + pp, hvN + ' ' + pp, Q(hv, pp));
      case 'ppc': return M(hv + ' been ' + ing, hvN + ' been ' + ing, Q(hv, 'been ' + ing));
      case 'pap': return M('had ' + pp, 'hadn\'t ' + pp, Q('had', pp));
      case 'fut': return M('will ' + b, 'won\'t ' + b, Q('will', b));
      case 'fp': return M('will have ' + pp, 'won\'t have ' + pp, Q('will', 'have ' + pp));
      case 'cond': return M('would ' + b, 'wouldn\'t ' + b, Q('would', b));
    }
    return '';
  }
  function conj(arg) {
    const VB = window.VERBS || [];
    let cur = (arg && arg.v) || 'work', mode = (arg && arg.mode) || 'aff', filter = '';
    view.innerHTML = '<header class="page-h"><p class="mono">Ferramenta</p><h1>Conjugador de <span>verbos</span></h1>' +
      '<p class="sub">Escolha um verbo e veja todos os tempos, em todas as pessoas. Toque em uma linha para ouvir.</p><button class="say" id="to-vt" type="button">📋 Ver a tabela de verbos</button></header>' +
      '<div class="cj-bar"><input id="cj-q" class="cj-q" type="search" placeholder="Buscar: pay, enviar, go…" autocomplete="off" aria-label="Buscar verbo"></div>' +

    function chips() {

      $('#cj-chips').innerHTML = list.length ? list.map(function (v) { return '<button class="cj-chip' + (v[0] === cur ? ' on' : '') + '" data-v="' + v[0] + '">' + v[0] + '</button>'; }).join('') : '<p class="muted">Nenhum verbo encontrado.</p>';
      $$('.cj-chip').forEach(function (b) { b.onclick = function () { cur = b.dataset.v; chips(); out(); }; });
    }
    function out() {
      const v = VB.find(function (x) { return x[0] === cur; }) || VB[0];

      $('#cj-out').innerHTML = '<div class="tile cj-head"><div class="cj-title"><h2>' + esc(v[0]) + '</h2><p class="muted">' + esc(v[5]) + '</p>' +
        (canSpeak ? '<button class="say" id="cj-say">' + I.sound + 'Ouvir</button>' : '') + '</div><div class="cj-forms">' + forms.map(function (f) { return '<div><span class="mono">' + f[0] + '</span><b>' + esc(f[1]) + '</b></div>'; }).join('') + '</div></div>' +
        '<div class="seg cj-seg" id="cj-seg"><button data-m="aff">Afirmativa</button><button data-m="neg">Negativa</button><button data-m="q">Pergunta</button></div>' +
        '<div class="cj-grid">' + TENSES.map(function (t) {
          return '<section class="tile cj-card"><p class="mono">' + t[2] + '</p><h3>' + t[1] + '</h3><p class="muted cj-use">' + t[3] + '</p><div class="cj-rows">' +
            PERS.map(function (p) {
              const ph = phrase(v, t[0], p, mode), full = mode === 'q' ? ph : p[0].split(' / ')[0] + ' ' + ph;
              return '<button class="cj-row" data-s="' + esc(full) + '">' + (mode === 'q' ? '' : '<span class="cj-p">' + p[0] + '</span>') + '<span class="cj-v">' + esc(ph) + '</span></button>';
            }).join('') + '</div></section>';
        }).join('') + '</div>';
      $$('#cj-seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === mode); b.onclick = function () { mode = b.dataset.m; out(); }; });
      $$('.cj-row').forEach(function (b) { b.onclick = function () { say(b.dataset.s.replace('…?', '').replace('…', '')); }; });
      const sy = $('#cj-say'); if (sy) sy.onclick = function () { say(v[0] + '. ' + v[3] + '. ' + v[4]); };
    }
    $('#to-vt').onclick = function () { go('vtab'); };
    $('#cj-q').oninput = function () { filter = this.value; chips(); };
    chips(); out();
  }


  /* ---------- TABELA DE VERBOS ---------- */
  function vtIrr(v) { return !(/ed$/.test(v[3]) && v[3] === v[4]); }
  function vtab() {
    const VB = window.VERBS || []; let q = '', mode = 'all';
    view.innerHTML = '<header class="page-h"><p class="mono">Consulta rápida</p><h1>Tabela de <span>verbos</span></h1>' +
      '<p class="sub">Presente, passado, particípio e futuro de ' + VB.length + ' verbos. Toque em uma linha para ouvir. Os irregulares aparecem em destaque.</p></header>' +

      '<div class="vt-tools"><div class="seg" id="vt-seg"><button data-m="all">Todos</button><button data-m="irr">Irregulares</button><button data-m="reg">Regulares</button></div>' +
      '<button class="say" id="vt-train" type="button">🎯 Treinar passado e particípio</button></div>' +

      '<p class="muted vt-note">Futuro = <b>will</b> + verbo base. Particípio é a forma usada em <b>have / has + particípio</b> (present perfect) e na voz passiva.</p>';
    function draw() {
      const f = q.trim().toLowerCase();
      const list = VB.filter(function (v) {
        if (mode === 'irr' && !vtIrr(v)) return false; if (mode === 'reg' && vtIrr(v)) return false;
        return !f || v[0].indexOf(f) === 0 || v[3] === f || v[4] === f || v[5].toLowerCase().indexOf(f) >= 0;
      });
      $('#vt-body').innerHTML = list.length ? list.map(function (v) {
        const irr = vtIrr(v);
        return '<button class="vt-row" data-s="' + esc(v[0] + ', ' + v[3] + ', ' + v[4]) + '"><span class="vt-c"><b>' + esc(v[0]) + '</b><small>' + esc(v[5]) + '</small></span>' +
          '<span class="vt-c' + (irr ? ' irr' : '') + '">' + esc(v[3]) + '</span><span class="vt-c' + (irr ? ' irr' : '') + '">' + esc(v[4]) + '</span><span class="vt-c fut">will ' + esc(v[0]) + '</span></button>';
      }).join('') : '<p class="muted" style="padding:18px">Nenhum verbo encontrado.</p>';
      $$('.vt-row').forEach(function (b) { b.onclick = function () { say(b.dataset.s); }; });
      $$('#vt-seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === mode); });
    }
    $$('#vt-seg button').forEach(function (b) { b.onclick = function () { mode = b.dataset.m; draw(); }; });
    $('#vt-q').oninput = function () { q = this.value; draw(); };
    $('#vt-train').onclick = vtSession;
    draw();
  }
  const VTLV = { id: 'VT', name: 'Verbos', color: 'var(--g2)', soft: 'var(--card-2)' };
  function vtSession() {
    const irr = (window.VERBS || []).filter(vtIrr);
    const qs = shuffle(irr).slice(0, 12).map(function (v, k) {
      const past = k % 2 === 0, right = past ? v[3] : v[4];
      let wr = shuffle([/e$/.test(v[0]) ? v[0] + 'd' : v[0] + 'ed', past ? v[4] : v[3], v[2], v[1]].filter(function (x, i, a) { return x !== right && a.indexOf(x) === i; })).slice(0, 2);
      while (wr.length < 2) wr.push(v[0] + 'd' + wr.length);
      return { t: 'drill', lv: VTLV.id, d: [past ? 'Yesterday I ___ (' + v[0] + ').' : 'I have already ___ (' + v[0] + ').', [right].concat(wr), v[5], '<b>' + esc(v[0]) + '</b> → ' + esc(v[3]) + ' → ' + esc(v[4]) + '.'] };
    });
    runSession({
      lv: VTLV, qs: qs, onQuit: function () { go('vtab'); },
      onEnd: function (r) {
        const p = r.right / r.total, gain = r.right * 8; addXP(gain);
        showResult({ lv: VTLV, right: r.right, total: r.total, gain: gain, missed: [], title: p >= .9 ? 'Verbos na ponta da língua!' : p >= .6 ? 'Bom treino!' : 'Vale repetir!',
          sub: 'Passado e particípio dos verbos irregulares.', medal: p >= .9 ? '🏆' : p >= .6 ? '📋' : '💪',
          again: vtSession, next: function () { go('vtab'); }, nextLabel: 'Voltar à tabela' });
      }
    });
  }

      $('#x-quit').onclick = function () { go('exp'); };

      const sy = $('#x-say'); if (sy) sy.onclick = function () { say(e.mail); };

        const a = q.ang + (1 - e) * .9 + t * .05 * (q.pt ? 1 : -1);
        const x = ox + Math.cos(a) * r * (q.pt ? 1 : .96), y = oy + Math.sin(a) * r * .72;
        cx.globalAlpha = Math.min(1, k * 1.2) * (t > 2.5 ? .3 : .85) * (q.pt ? 1 : .9);
        cx.fillStyle = q.pt ? '#FFA48D' : '#9CC2FF'; cx.font = '700 ' + (q.sz * dpr) + 'px Unbounded, system-ui, sans-serif'; cx.textAlign = 'center';
        cx.fillText(q.t, x, y);
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    /* texto digitado */
    const TAGS = ['Do primeiro "hello" ao fechamento do balanço.', 'Inglês que fecha negócios e fecha balanços.', 'Palavra por palavra, você atravessa a ponte.', 'Seu inglês, do básico ao contábil.', 'Hoje é dia de dar mais um passo.'];
    const TAG = TAGS[quick ? 1 + Math.floor(Math.random() * (TAGS.length - 1)) : 0];
    setTimeout(function () {
      const tg = $('#intro-tag', el); let n = 0;
      const iv = setInterval(function () { n++; tg.textContent = TAG.slice(0, n); if (n % 3 === 0) sfx('tap'); if (n >= TAG.length) clearInterval(iv); }, 38 / SPD);
    }, 3000 / SPD);
    setTimeout(function () { sfx('swell'); }, 200); setTimeout(function () { sfx('win'); }, 2300 / SPD);
    let done = false;
    function end() {
      if (done) return; done = true; sfx('ok'); S.introSeen = true; save();
      el.classList.add('out'); document.body.classList.remove('intro-on');
      setTimeout(function () { run = false; window.removeEventListener('resize', size); el.remove(); }, 900);
    }
    $('#intro-go', el).onclick = end; $('.intro-skip', el).onclick = end;
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') end(); });
    setTimeout(function () { try { $('#intro-go', el).focus({ preventScroll: true }); } catch (e) { } }, 4200 / SPD);
  }
  playIntro(false);
  applyTheme();
  authBoot();
})();

</script>
